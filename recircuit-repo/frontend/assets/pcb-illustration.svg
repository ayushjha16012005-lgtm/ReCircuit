<svg width="900" height="1300" viewBox="0 0 900 1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4635"/>
      <stop offset="100%" stop-color="#0F5C46"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2027"/>
      <stop offset="100%" stop-color="#0C0F12"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="1300" fill="url(#boardGrad)"/>

  <!-- Copper traces -->
  <g stroke="#3FBE8E" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 60 120 H 300 V 220 H 480"/>
    <path d="M 480 220 H 700 V 90"/>
    <path d="M 120 260 V 420 H 260"/>
    <path d="M 260 420 H 260 V 520 H 420"/>
    <path d="M 420 520 V 640 H 620"/>
    <path d="M 620 640 V 760"/>
    <path d="M 100 560 H 220 V 700 H 340"/>
    <path d="M 340 700 V 860 H 180"/>
    <path d="M 180 860 V 980"/>
    <path d="M 500 780 H 700 V 900 H 560"/>
    <path d="M 560 900 V 1020 H 760"/>
    <path d="M 760 1020 V 1160"/>
    <path d="M 60 1040 H 260 V 1180 H 460"/>
    <path d="M 460 1180 V 1260"/>
    <path d="M 620 120 V 300 H 780 V 480"/>
    <path d="M 780 480 V 620"/>
    <path d="M 200 90 V 40"/>
    <path d="M 640 960 H 840"/>
  </g>

  <!-- Via dots -->
  <g fill="#7EE0B8">
    <circle cx="60" cy="120" r="6"/>
    <circle cx="300" cy="120" r="6"/>
    <circle cx="300" cy="220" r="6"/>
    <circle cx="480" cy="220" r="6"/>
    <circle cx="700" cy="90" r="6"/>
    <circle cx="120" cy="260" r="6"/>
    <circle cx="120" cy="420" r="6"/>
    <circle cx="260" cy="420" r="6"/>
    <circle cx="260" cy="520" r="6"/>
    <circle cx="420" cy="520" r="6"/>
    <circle cx="420" cy="640" r="6"/>
    <circle cx="620" cy="640" r="6"/>
    <circle cx="620" cy="760" r="6"/>
    <circle cx="100" cy="560" r="6"/>
    <circle cx="220" cy="560" r="6"/>
    <circle cx="220" cy="700" r="6"/>
    <circle cx="340" cy="700" r="6"/>
    <circle cx="340" cy="860" r="6"/>
    <circle cx="180" cy="860" r="6"/>
    <circle cx="180" cy="980" r="6"/>
    <circle cx="500" cy="780" r="6"/>
    <circle cx="700" cy="780" r="6"/>
    <circle cx="700" cy="900" r="6"/>
    <circle cx="560" cy="900" r="6"/>
    <circle cx="560" cy="1020" r="6"/>
    <circle cx="760" cy="1020" r="6"/>
    <circle cx="760" cy="1160" r="6"/>
    <circle cx="60" cy="1040" r="6"/>
    <circle cx="260" cy="1040" r="6"/>
    <circle cx="260" cy="1180" r="6"/>
    <circle cx="460" cy="1180" r="6"/>
    <circle cx="460" cy="1260" r="6"/>
    <circle cx="620" cy="300" r="6"/>
    <circle cx="780" cy="300" r="6"/>
    <circle cx="780" cy="480" r="6"/>
    <circle cx="200" cy="90" r="6"/>
    <circle cx="840" cy="960" r="6"/>
  </g>

  <!-- Main microcontroller chip -->
  <g>
    <rect x="330" y="330" width="180" height="180" rx="8" fill="url(#chipGrad)" stroke="#000" stroke-width="1"/>
    <rect x="352" y="352" width="136" height="136" rx="4" fill="#111826"/>
    <circle cx="360" cy="360" r="4" fill="#3FBE8E"/>
    <!-- pins -->
    <g stroke="#C9C9C9" stroke-width="4">
      <line x1="330" y1="350" x2="310" y2="350"/>
      <line x1="330" y1="375" x2="310" y2="375"/>
      <line x1="330" y1="400" x2="310" y2="400"/>
      <line x1="330" y1="425" x2="310" y2="425"/>
      <line x1="330" y1="450" x2="310" y2="450"/>
      <line x1="330" y1="475" x2="310" y2="475"/>
      <line x1="510" y1="350" x2="530" y2="350"/>
      <line x1="510" y1="375" x2="530" y2="375"/>
      <line x1="510" y1="400" x2="530" y2="400"/>
      <line x1="510" y1="425" x2="530" y2="425"/>
      <line x1="510" y1="450" x2="530" y2="450"/>
      <line x1="510" y1="475" x2="530" y2="475"/>
      <line x1="350" y1="330" x2="350" y2="310"/>
      <line x1="375" y1="330" x2="375" y2="310"/>
      <line x1="400" y1="330" x2="400" y2="310"/>
      <line x1="425" y1="330" x2="425" y2="310"/>
      <line x1="450" y1="330" x2="450" y2="310"/>
      <line x1="475" y1="330" x2="475" y2="310"/>
      <line x1="350" y1="510" x2="350" y2="530"/>
      <line x1="375" y1="510" x2="375" y2="530"/>
      <line x1="400" y1="510" x2="400" y2="530"/>
      <line x1="425" y1="510" x2="425" y2="530"/>
      <line x1="450" y1="510" x2="450" y2="530"/>
      <line x1="475" y1="510" x2="475" y2="530"/>
    </g>
  </g>

  <!-- Small IC -->
  <rect x="600" y="150" width="110" height="50" rx="4" fill="url(#chipGrad)"/>
  <g stroke="#C9C9C9" stroke-width="3">
    <line x1="612" y1="150" x2="612" y2="135"/>
    <line x1="632" y1="150" x2="632" y2="135"/>
    <line x1="652" y1="150" x2="652" y2="135"/>
    <line x1="672" y1="150" x2="672" y2="135"/>
    <line x1="692" y1="150" x2="692" y2="135"/>
    <line x1="612" y1="200" x2="612" y2="215"/>
    <line x1="632" y1="200" x2="632" y2="215"/>
    <line x1="652" y1="200" x2="652" y2="215"/>
    <line x1="672" y1="200" x2="672" y2="215"/>
    <line x1="692" y1="200" x2="692" y2="215"/>
  </g>

  <!-- Resistors -->
  <g>
    <rect x="130" y="600" width="80" height="26" rx="4" fill="#E8C27A"/>
    <rect x="150" y="600" width="6" height="26" fill="#8B4A2B"/>
    <rect x="165" y="600" width="6" height="26" fill="#111"/>
    <rect x="180" y="600" width="6" height="26" fill="#C0392B"/>
    <line x1="110" y1="613" x2="130" y2="613" stroke="#C9C9C9" stroke-width="4"/>
    <line x1="210" y1="613" x2="232" y2="613" stroke="#C9C9C9" stroke-width="4"/>
  </g>
  <g transform="translate(500,650) rotate(90)">
    <rect x="0" y="0" width="80" height="26" rx="4" fill="#E8C27A"/>
    <rect x="20" y="0" width="6" height="26" fill="#8B4A2B"/>
    <rect x="35" y="0" width="6" height="26" fill="#111"/>
    <rect x="50" y="0" width="6" height="26" fill="#3FBE8E"/>
    <line x1="-20" y1="13" x2="0" y2="13" stroke="#C9C9C9" stroke-width="4"/>
    <line x1="80" y1="13" x2="102" y2="13" stroke="#C9C9C9" stroke-width="4"/>
  </g>

  <!-- Capacitors (cylindrical) -->
  <g>
    <ellipse cx="700" cy="700" rx="26" ry="10" fill="#2E2E2E"/>
    <rect x="674" y="700" width="52" height="60" fill="#2E2E2E"/>
    <ellipse cx="700" cy="760" rx="26" ry="10" fill="#1B1B1B"/>
    <rect x="686" y="700" width="10" height="60" fill="#4A4A4A" opacity="0.5"/>
    <line x1="700" y1="760" x2="700" y2="785" stroke="#C9C9C9" stroke-width="4"/>
    <line x1="700" y1="700" x2="700" y2="675" stroke="#C9C9C9" stroke-width="4"/>
  </g>
  <g>
    <ellipse cx="220" cy="900" rx="20" ry="8" fill="#2E2E2E"/>
    <rect x="200" y="900" width="40" height="46" fill="#2E2E2E"/>
    <ellipse cx="220" cy="946" rx="20" ry="8" fill="#1B1B1B"/>
    <line x1="220" y1="946" x2="220" y2="966" stroke="#C9C9C9" stroke-width="4"/>
    <line x1="220" y1="900" x2="220" y2="880" stroke="#C9C9C9" stroke-width="4"/>
  </g>

  <!-- Crystal oscillator -->
  <rect x="600" y="380" width="60" height="36" rx="6" fill="#B8C4CC"/>
  <rect x="608" y="388" width="44" height="20" rx="3" fill="#7A8A93"/>
  <line x1="612" y1="416" x2="612" y2="434" stroke="#C9C9C9" stroke-width="4"/>
  <line x1="648" y1="416" x2="648" y2="434" stroke="#C9C9C9" stroke-width="4"/>

  <!-- Connector header -->
  <g>
    <rect x="60" y="200" width="120" height="46" rx="4" fill="#111"/>
    <g fill="#D8B23A">
      <rect x="70" y="200" width="10" height="46"/>
      <rect x="90" y="200" width="10" height="46"/>
      <rect x="110" y="200" width="10" height="46"/>
      <rect x="130" y="200" width="10" height="46"/>
      <rect x="150" y="200" width="10" height="46"/>
      <rect x="170" y="200" width="10" height="46"/>
    </g>
  </g>

  <!-- Diodes / LEDs -->
  <circle cx="400" cy="900" r="14" fill="#3FBE8E"/>
  <circle cx="400" cy="900" r="14" fill="none" stroke="#7EE0B8" stroke-width="2" opacity="0.6"/>
  <circle cx="450" cy="960" r="10" fill="#E8C27A"/>

  <!-- Mounting holes -->
  <g fill="none" stroke="#C9C9C9" stroke-width="3" opacity="0.6">
    <circle cx="60" cy="60" r="14"/>
    <circle cx="840" cy="60" r="14"/>
    <circle cx="60" cy="1240" r="14"/>
    <circle cx="840" cy="1240" r="14"/>
  </g>

  <!-- Silkscreen labels -->
  <g fill="#7EE0B8" opacity="0.5" font-family="monospace" font-size="14">
    <text x="330" y="325">U1</text>
    <text x="600" y="145">U2</text>
    <text x="130" y="595">R1</text>
    <text x="674" y="695">C1</text>
    <text x="60" y="195">J1</text>
  </g>
</svg>
